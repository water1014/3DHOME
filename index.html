<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>小窝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<!-- ══ 页面 ══ -->
<section class="pg" id="pg-home"></section>
<section class="pg" id="pg-mem"></section>
<section class="pg" id="pg-chat"></section>
<section class="pg" id="pg-daily"></section>
<section class="pg" id="pg-read"></section>
<section class="pg" id="pg-mine"></section>

<!-- ══ 左上角侧栏按钮 ══ -->
<button id="side-btn" aria-label="菜单">
  <svg class="ic" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="16" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
</button>
<div class="side-overlay" id="side-overlay"></div>
<aside class="side-drawer" id="side-drawer">
  <div class="sd-head">
    <div class="sd-ava">她</div>
    <div>
      <div class="sd-names" id="sd-names">他 & 她</div>
      <div class="micro">XIAOWO · ARCHIVE</div>
    </div>
  </div>
  <nav class="sd-nav" id="sd-nav">
    <button class="sd-item" data-go="home"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>首页<span class="sd-en">HOME</span></button>
    <button class="sd-item" data-go="mem"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-9.5-9C1 8.5 3 4.5 7 4.5c2.2 0 3.7 1.2 5 3 1.3-1.8 2.8-3 5-3 4 0 6 4 4.5 7.5-2 4.1-9.5 9-9.5 9z"/></svg>记忆<span class="sd-en">MEMORY</span></button>
    <button class="sd-item" data-go="chat"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>聊天<span class="sd-en">CHAT</span></button>
    <button class="sd-item" data-go="daily"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="3" y1="10" x2="21" y2="10"/></svg>日常<span class="sd-en">DAILY</span></button>
    <button class="sd-item" data-go="read"><svg class="ic" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>阅读<span class="sd-en">READ</span></button>
    <button class="sd-item" data-go="mine"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.4 4-5 7-5s5.8 1.6 7 5"/></svg>我的<span class="sd-en">PROFILE</span></button>
  </nav>
  <div class="sd-foot">
    <button class="sd-item" id="sd-theme">
      <svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      深色模式<span class="switch" id="sd-switch"></span>
    </button>
  </div>
</aside>

<!-- ══ 全局底栏：5 项 ══ -->
<nav class="tabbar">
  <a class="tab-item" data-go="home">
    <svg viewBox="0 0 24 24" class="ic"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg>
    <span>Home</span>
  </a>
  <a class="tab-item" data-go="mem">
    <svg viewBox="0 0 24 24" class="ic"><path d="M12 21s-7.5-4.9-9.5-9C1 8.5 3 4.5 7 4.5c2.2 0 3.7 1.2 5 3 1.3-1.8 2.8-3 5-3 4 0 6 4 4.5 7.5-2 4.1-9.5 9-9.5 9z"/></svg>
    <span>Memory</span>
  </a>
  <a class="tab-item" data-go="chat">
    <svg viewBox="0 0 24 24" class="ic"><path d="M4 5h16v11H9l-5 4z"/></svg>
    <span>Chat</span>
  </a>
  <a class="tab-item" data-go="daily">
    <svg viewBox="0 0 24 24" class="ic"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>Daily</span>
  </a>
  <a class="tab-item" data-go="read">
    <svg viewBox="0 0 24 24" class="ic"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
    <span>Read</span>
  </a>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/chime.js"></script>
<script src="js/home.js"></script>
<script src="js/chat.js"></script>
<script src="js/mine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
